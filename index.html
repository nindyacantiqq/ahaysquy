<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071b17">
  <title>Masjid Display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <header class="topbar">
      <div class="brand">
        <div class="mosque-icon">🕌</div>
        <div>
          <div class="mosque-name" id="mosqueName">MASJID</div>
          <div class="subtitle">PUSAT INFORMASI MASJID</div>
        </div>
      </div>
      <div class="date-box">
        <div id="dayDate">Memuat tanggal...</div>
        <div class="hijri" id="hijriDate">Memuat kalender...</div>
      </div>
    </header>

    <section class="hero">
      <div class="clock" id="clock">00:00:00</div>
      <div class="status" id="status">Memuat jadwal...</div>
      <div class="countdown" id="countdown">--:--:--</div>
    </section>

    <section class="prayer-grid" id="prayerGrid"></section>

    <section class="bottom-grid">
      <article class="panel announcement">
        <div class="panel-title">📢 PENGUMUMAN</div>
        <div class="ticker-wrap">
          <div class="ticker" id="ticker">Memuat pengumuman...</div>
        </div>
      </article>

      <article class="panel quote">
        <div class="panel-title">📖 RENUNGAN</div>
        <div id="quoteText">Memuat...</div>
        <div class="quote-source" id="quoteSource"></div>
      </article>
    </section>

    <footer>
      <span id="footerText">Mohon nonaktifkan suara ponsel selama berada di dalam masjid.</span>
      <span>Tekan F untuk fullscreen</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
